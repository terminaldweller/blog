services:
  nginx-crs:
    image: waf
    build:
      context: .
      dockerfile: ./Dockerfile_waf
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    ports:
      - 9000:443
    restart: unless-stopped
    networks:
      blognet:
        ipv4_address: 172.16.55.10
    environment:
      - MODSECURITY_RULE_ENGINE=On
      - BLOCKING_PARANOIA=1
      - DETECTION_PARANOIA=1
      - ALLOWED_REQUEST_CONTENT_TYPE_CHARSET=|utf-8|
      - VALIDATE_UTF8_ENCODING=1
      - ALLOWED_METHODS=GET HEAD
      - ALLOWED_HTTP_VERSIONS=HTTP/2.0 HTTP/3.0
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/waf.conf:ro
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - SETGID
      - SETUID
      - NET_BIND_SERVICE
    runtime: runsc
  blog:
    image: blog
    build:
      context: .
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    restart: unless-stopped
    networks:
      blognet:
        ipv4_address: 172.16.55.11
      dbnet:
        ipv4_address: 172.16.56.11
    depends_on:
      - nginx-crs
      - mongo
    secrets:
      - mongo_user
      - mongo_pass
    security_opt:
      - no-new-privileges
    cap_drop:
      - ALL
    read_only: true
    runtime: runsc
  mongo:
    image: mongo:7
    deploy:
      resources:
        limits:
          memory: 128M
    logging:
      driver: "json-file"
      options:
        max-size: "50m"
        max-file: "3"
    networks:
      dbnet:
        ipv4_address: 172.16.56.10
    restart: unless-stopped
    ports:
      - "127.0.0.1:27117:27017"
      - "127.0.0.1:27118:27018"
      - "127.0.0.1:27119:27019"
    volumes:
      - blog-data:/data/db
    environment:
      - MONGO_INITDB_ROOT_USERNAME_FILE=/run/secrets/mongo_user
      - MONGO_INITDB_ROOT_PASSWORD_FILE=/run/secrets/mongo_pass
    secrets:
      - mongo_user
      - mongo_pass
    security_opt:
      - no-new-privileges
    runtime: runsc
networks:
  blognet:
    enable_ipv6: true
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.55.0/24
  dbnet:
    enable_ipv6: false
    driver: bridge
    ipam:
      config:
        - subnet: 172.16.56.0/24
volumes:
  blog-data:
secrets:
  mongo_user:
    file: ./mongo_secrets/mongo_user
  mongo_pass:
    file: ./mongo_secrets/mongo_pass
